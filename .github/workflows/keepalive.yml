name: Keep Supabase active
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          URL: ${{ vars.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/items?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP $code"
          test "$code" = "200"
